<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f7f9fb"/>
  <text x="450" y="40" font-family="Arial" font-size="28" text-anchor="middle" fill="#1f3c5a">Evolution of Server Architecture</text>

  <rect x="60" y="100" width="210" height="120" rx="12" fill="#dfeaf2" stroke="#2f6b8a" stroke-width="3"/>
  <text x="165" y="140" font-family="Arial" font-size="22" text-anchor="middle" fill="#1f3c5a">Centralized</text>
  <text x="165" y="172" font-family="Arial" font-size="20" text-anchor="middle" fill="#1f3c5a">Mainframe</text>
  <text x="165" y="202" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">One powerful system</text>

  <rect x="345" y="100" width="210" height="120" rx="12" fill="#dfeaf2" stroke="#2f6b8a" stroke-width="3"/>
  <text x="450" y="140" font-family="Arial" font-size="22" text-anchor="middle" fill="#1f3c5a">Client-Server</text>
  <text x="450" y="172" font-family="Arial" font-size="20" text-anchor="middle" fill="#1f3c5a">Networks</text>
  <text x="450" y="202" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Dedicated service machines</text>

  <rect x="630" y="100" width="210" height="120" rx="12" fill="#dfeaf2" stroke="#2f6b8a" stroke-width="3"/>
  <text x="735" y="140" font-family="Arial" font-size="22" text-anchor="middle" fill="#1f3c5a">Virtualized</text>
  <text x="735" y="172" font-family="Arial" font-size="20" text-anchor="middle" fill="#1f3c5a">Cloud</text>
  <text x="735" y="202" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Elastic shared resources</text>

  <line x1="270" y1="160" x2="345" y2="160" stroke="#2f6b8a" stroke-width="4"/>
  <polygon points="345,160 330,152 330,168" fill="#2f6b8a"/>
  <line x1="555" y1="160" x2="630" y2="160" stroke="#2f6b8a" stroke-width="4"/>
  <polygon points="630,160 615,152 615,168" fill="#2f6b8a"/>

  <rect x="110" y="310" width="120" height="60" rx="8" fill="#ffffff" stroke="#1f3c5a" stroke-width="2"/>
  <rect x="390" y="310" width="120" height="60" rx="8" fill="#ffffff" stroke="#1f3c5a" stroke-width="2"/>
  <rect x="670" y="310" width="120" height="60" rx="8" fill="#ffffff" stroke="#1f3c5a" stroke-width="2"/>

  <text x="170" y="346" font-family="Arial" font-size="18" text-anchor="middle" fill="#1f3c5a">Users</text>
  <text x="450" y="346" font-family="Arial" font-size="18" text-anchor="middle" fill="#1f3c5a">Clients</text>
  <text x="730" y="346" font-family="Arial" font-size="18" text-anchor="middle" fill="#1f3c5a">Apps & APIs</text>

  <line x1="170" y1="220" x2="170" y2="310" stroke="#2f6b8a" stroke-width="3"/>
  <line x1="450" y1="220" x2="450" y2="310" stroke="#2f6b8a" stroke-width="3"/>
  <line x1="730" y1="220" x2="730" y2="310" stroke="#2f6b8a" stroke-width="3"/>

  <text x="450" y="450" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Servers changed from single physical machines to distributed software-defined infrastructure.</text>
</svg>
